[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cheap-filter"
version = "0.1.0"
description = "Cost-efficient vulnerability scanner: LLVM static analysis filter + LLM verification"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "libclang>=16.0",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
cheap-filter = "cheap_filter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cheap_filter"]

[tool.ruff]
line-length = 100
